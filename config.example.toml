# Copy to ~/.config/rename-scans/config.toml (or pass --config FILE).

# Folders scanned for raw scanner files (YYYY_MM_DD_HH_MM_SS.pdf).
# {year} becomes the current year. ~ is expanded.
folders = [
  "~/scans/{year}-scans",
]

# api_key_file = "~/.config/rename-scans/api_key"   # ANTHROPIC_API_KEY wins if set
# model = "claude-opus-5-5"
# min_age_secs = 60
# lock_dir = "~/.rename-scans.lock"

# How the scanner names files, and what to rename them to (strftime codes).
# The timestamp parsed from raw_format fills name_format; {name} is Claude's
# description. Only files whose names parse with raw_format are touched.
# raw_format = "%Y_%m_%d_%H_%M_%S.pdf"
# name_format = "%Y%m%d_%H%M%S_{name}.pdf"

# Each medical receipt adds a row to this file: date printed on the receipt,
# issuer as printed, amount (tab-separated, ready to paste into a spreadsheet).
# A relative path lives next to the scans; "" turns it off.
# paste_file = "to-paste.tsv"
# paste_date_format = "%m/%d/%Y"

# Clinic and pharmacy names: the first time an issuer appears, its romaji is
# saved here (kanji<TAB>romaji) and reused for every later receipt, so the same
# clinic always gets the same filename. Edit it to choose your own spelling.
# "" turns it off.
# issuers_file = "~/.config/rename-scans/issuers.tsv"
